<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2774AE" />
    <meta name="description" content="Pleak: a simple workout tracker." />

    <script>
      (function () {
        try {
          var saved = localStorage.getItem("pleak-theme");
          var isDark =
            saved === "dark" ||
            (saved !== "light" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.add(isDark ? "dark" : "light");
        } catch (e) {}
      })();

      // Decode a path redirected here by 404.html (see public/404.html)
      // back into a real client-side route before the app boots.
      (function () {
        var search = window.location.search;
        if (search[1] === "/") {
          var decoded = search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            })
            .join("?");
          window.history.replaceState(
            null,
            "",
            window.location.pathname.slice(0, -1) +
              decoded +
              window.location.hash,
          );
        }
      })();
    </script>

    <link rel="icon" type="image/x-icon" href="/pleak/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/pleak/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/pleak/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/pleak/apple-touch-icon.png" />
    <link rel="manifest" href="/pleak/manifest.webmanifest" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <title>Pleak</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
