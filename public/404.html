<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Pleak</title>
    <script>
      // GitHub Pages has no server-side routing, so a deep link or refresh on
      // a client-side route (e.g. /pleak/workout) hits this 404 page. Encode
      // the path into a query string and redirect to index.html, which
      // decodes it back via the matching script there. See:
      // https://github.com/rafgraph/spa-github-pages
      var segmentCount = 1; // matches the "/pleak" base path segment
      var l = window.location;
      l.replace(
        l.protocol +
          "//" +
          l.hostname +
          (l.port ? ":" + l.port : "") +
          l.pathname
            .split("/")
            .slice(0, 1 + segmentCount)
            .join("/") +
          "/?p=/" +
          l.pathname
            .slice(1)
            .split("/")
            .slice(segmentCount)
            .join("/")
            .replace(/&/g, "~and~") +
          (l.search ? "&q=" + l.search.slice(1).replace(/&/g, "~and~") : "") +
          l.hash,
      );
    </script>
  </head>
  <body></body>
</html>
